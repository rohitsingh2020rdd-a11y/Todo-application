  <meta charset="UTF-8">

<body class="bg-slate-200 my-30">
  <div class="bg-white max-w-md mx-auto  rounded-2xl shadow-gray-400 shadow-md ">

     <h1 class="text-2xl font-bold">Todo App</h1>
   </div>

   <div class="p-5">
     <form id="todo-form" action="" class="flex flex-col mb-6" >
      <div class="flex gap-5 mb-1 w-full">
         <input id="todoInput" class="border-1 h-12 border-gray-500 border-2 px-4 py-3 flex-1 text-sm font-semibold rounded-md focus:border-blue-900 outline-none shadow-md " type="text"  placeholder="Enter task discription...">
       <button id="form-btn" class="px-5  py-2 bg-indigo-800 text-white rounded-lg font-semibold hover:opacity-90">Add</button>
      </div>
       <button id="cancel-btn" class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer ">Cancel Editing
       </button>
     </form>
     <div class="flex justify-between py-2 pb-1 text-xs border-b-2 border-gray-300">
      <p id="task-count">task{0}</p>
      <p id="complete-count">Completed : {0}</p>
     </div>

     <ul class="py-5 flex flex-col " id="todo-List">
